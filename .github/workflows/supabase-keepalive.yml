name: Supabase Keep-Alive Cron

on:
  schedule:
    # Corre todos os dias às 05:00 UTC (evita a suspensão do Supabase Free Tier)
    - cron: '37 5 * * *'
  workflow_dispatch: # Permite executar manualmente a partir do separador "Actions" do GitHub

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Ping to Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "❌ ERRO: As variáveis SUPABASE_URL ou SUPABASE_ANON_KEY não estão configuradas nos Secrets do GitHub."
            exit 1
          fi

          echo "A iniciar ping à base de dados Supabase..."
          
          # 1. Ping à tabela 'users' para acordar o PostgREST e a base de dados PostgreSQL
          # Usamos o endpoint REST oficial com o cabeçalho apikey e Authorization Bearer
          RESPONSE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "${SUPABASE_URL}/rest/v1/users?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json")

          echo "Código de Resposta HTTP para o ping da tabela: $RESPONSE_STATUS"

          # Se responder 200 (OK), 206, ou 404/400 (se a tabela não existir, mas o servidor respondeu),
          # significa que a base de dados está operacional e respondeu ao pedido.
          # Apenas códigos de erro de rede, timeouts ou 401/403 de chaves inválidas devem ser investigados.
          if [ "$RESPONSE_STATUS" -eq 200 ] || [ "$RESPONSE_STATUS" -eq 204 ] || [ "$RESPONSE_STATUS" -eq 404 ] || [ "$RESPONSE_STATUS" -eq 400 ]; then
            echo "✅ Sucesso! O servidor do Supabase respondeu e a ligação foi mantida ativa."
          else
            echo "⚠️ Alerta: O servidor respondeu com o código HTTP $RESPONSE_STATUS. Verifique as credenciais nos Secrets do GitHub."
            exit 1
          fi
