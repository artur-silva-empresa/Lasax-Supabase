name: Supabase Keep-Alive Cron

on:
  schedule:
    # Corre todos os dias às 05:00 UTC (evita a suspensão do Supabase Free Tier)
    - cron: '37 5 * * *'
  workflow_dispatch: # Permite executar manualmente a partir do separador "Actions" do GitHub

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Ping to Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "❌ ERRO: As variáveis SUPABASE_URL ou SUPABASE_ANON_KEY não estão configuradas nos Secrets do GitHub."
            exit 1
          fi

          echo "A iniciar ping à base de dados Supabase..."
          
          # Fazemos ping à raiz da API REST (PostgREST) que retorna a especificação OpenAPI
          # Isto garante sempre um 200 OK independentemente de existirem tabelas criadas ou não.
          RESPONSE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "${SUPABASE_URL}/rest/v1/" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "Código de Resposta HTTP para o ping: $RESPONSE_STATUS"

          if [ "$RESPONSE_STATUS" -eq 200 ]; then
            echo "✅ Sucesso! O servidor do Supabase respondeu com 200 OK e a ligação foi mantida ativa."
          else
            echo "⚠️ Alerta: O servidor respondeu com o código HTTP $RESPONSE_STATUS. Verifique as credenciais nos Secrets do GitHub ou o estado do projeto."
            exit 1
          fi
